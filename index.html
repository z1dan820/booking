<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Slot - HAZI STUDIO</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        dark: '#0a0a0a',
                        card: '#111111',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-4 font-sans selection:bg-white selection:text-black">

    <div class="max-w-md w-full bg-card border border-white/10 rounded-3xl shadow-[0_0_40px_rgba(255,255,255,0.05)] overflow-hidden relative">
        
        <div class="p-8 text-center relative z-10">
            <div class="mx-auto w-24 h-24 rounded-full border border-white/30 p-1 mb-4">
                <img src="foto.png" 
                     onerror="this.src='https://ui-avatars.com/api/?name=Hazi+Studio&background=fff&color=000&bold=true'"
                     alt="Barber" class="w-full h-full object-cover rounded-full grayscale hover:grayscale-0 transition duration-500">
            </div>
            <h1 class="text-3xl font-serif font-bold tracking-wide">HAZI STUDIO</h1>
            <p class="text-gray-400 text-sm mt-1 tracking-widest uppercase text-[10px]">Premium Cuts by Fahrul</p>
        </div>

        <div class="px-8 pb-6 border-b border-white/5">
            <div class="flex justify-between items-center bg-white/5 p-4 rounded-xl border border-white/5 backdrop-blur-sm">
                <div class="text-left">
                    <p class="text-[10px] text-gray-400 uppercase tracking-wider">Tarif</p>
                    <p class="text-xl font-serif font-bold text-white">35K</p>
                </div>
                <div class="h-8 w-[1px] bg-white/10"></div>
                <div class="text-right">
                    <p class="text-[10px] text-gray-400 uppercase tracking-wider">Jam Ops</p>
                    <p class="text-xl font-serif font-bold text-white">10:00 - 15:00</p>
                </div>
            </div>
        </div>

        <div class="p-6 bg-dark">
            <div class="flex justify-between items-end mb-6">
                <h3 class="text-lg font-serif font-bold text-white">Pilih Jadwal</h3>
                <span class="text-[10px] text-gray-500 bg-white/5 px-2 py-1 rounded">Hari Ini</span>
            </div>
            
            <div id="slot-container" class="space-y-3">
                <div class="space-y-3 animate-pulse">
                    <div class="h-16 bg-white/5 rounded-xl"></div>
                    <div class="h-16 bg-white/5 rounded-xl"></div>
                    <div class="h-16 bg-white/5 rounded-xl"></div>
                </div>
            </div>
            
            <div id="error-msg" class="hidden mt-6 p-4 bg-red-900/20 border border-red-900/50 rounded-lg text-center">
                <p class="text-red-400 text-xs font-bold">Koneksi Server Terputus</p>
                <p class="text-gray-500 text-[10px] mt-1">Cek admin untuk update domain</p>
            </div>
        </div>
    </div>

    <script>
        const WA_NUMBER = "6288271187357";
        const CONTAINER = document.getElementById('slot-container');
        const API_URL = localStorage.getItem('hazi_api_url');

        async function loadSlots() {
            if (!API_URL) {
                renderError("Domain Server belum disetting.");
                return;
            }

            try {
                const res = await fetch(`${API_URL}/slots`);
                if (!res.ok) throw new Error('Network error');
                const data = await res.json();
                renderSlots(data.slots);
            } catch (err) {
                renderError("Server Offline");
            }
        }

        function renderSlots(slots) {
            CONTAINER.innerHTML = '';
            const hours = ["10:00", "11:00", "12:00", "13:00", "14:00"];
            
            // LOGIKA WAKTU (CLIENT SIDE)
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();

            hours.forEach(time => {
                let status = slots[time] || 'booked';
                
                // === LOGIC PENGECEKAN JAM ===
                const slotHour = parseInt(time.split(':')[0]); // Ambil angka jam (10, 11, dst)
                
                let isExpired = false;

                // Jika jam sekarang lebih besar dari slot (misal skrg jam 11, slot jam 10)
                if (currentHour > slotHour) {
                    isExpired = true;
                } 
                // Jika jam sama, tapi menit sudah lewat 0 (misal 10:01)
                else if (currentHour === slotHour && currentMinute > 0) {
                    isExpired = true;
                }

                // Jika expired, paksa status jadi booked/expired visualnya
                if (isExpired) {
                    status = 'expired';
                }

                const isAvailable = status === 'available';
                
                // Styles Dynamic
                let cardClass = "";
                let buttonHtml = "";

                if (isAvailable) {
                    // STYLE: AVAILABLE (Putih/Mewah)
                    cardClass = "bg-white/5 border border-white/20 hover:border-white transition-all group cursor-pointer";
                    buttonHtml = `
                        <button onclick="openWA('${time}')" class="bg-white text-black font-bold text-xs px-4 py-2 rounded-lg hover:bg-gray-200 transition shadow-[0_0_15px_rgba(255,255,255,0.3)]">
                            BOOKING
                        </button>
                    `;
                } else if (status === 'expired') {
                    // STYLE: EXPIRED (Gelap/Mati)
                    cardClass = "bg-white/[0.02] border border-transparent opacity-40 cursor-not-allowed";
                    buttonHtml = `<span class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">TERLEWAT</span>`;
                } else {
                    // STYLE: BOOKED (Sudah diisi orang)
                    cardClass = "bg-white/[0.02] border border-transparent opacity-50 cursor-not-allowed";
                    buttonHtml = `<span class="text-[10px] font-bold text-gray-500 uppercase tracking-wider line-through">BOOKED</span>`;
                }
                
                // Render HTML Element
                const el = document.createElement('div');
                el.className = `w-full p-4 rounded-2xl flex justify-between items-center mb-3 ${cardClass}`;
                
                el.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="h-2 w-2 rounded-full ${isAvailable ? 'bg-green-500 shadow-[0_0_8px_#22c55e]' : 'bg-gray-600'}"></div>
                        <span class="font-serif font-bold text-xl ${isAvailable ? 'text-white' : 'text-gray-500'}">${time}</span>
                    </div>
                    <div>${buttonHtml}</div>
                `;

                CONTAINER.appendChild(el);
            });
        }

        function openWA(time) {
            const text = `Halo, saya mau booking Hazi Studio jam ${time} hari ini.`;
            const url = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(text)}`;
            window.location.href = url;
        }

        function renderError(msg) {
            const errDiv = document.getElementById('error-msg');
            errDiv.classList.remove('hidden');
            CONTAINER.innerHTML = '';
        }

        loadSlots();
    </script>
</body>
</html>
