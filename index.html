<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Slot - HAZI STUDIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
                    colors: { dark: '#0a0a0a', card: '#111111' }
                }
            }
        }
    </script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="max-w-md w-full bg-card border border-white/10 rounded-3xl shadow-[0_0_40px_rgba(255,255,255,0.05)] overflow-hidden relative">
        <div class="p-8 text-center relative z-10">
            <div class="mx-auto w-24 h-24 rounded-full border border-white/30 p-1 mb-4">
                <img src="foto.png" onerror="this.src='https://ui-avatars.com/api/?name=Hazi+Studio&background=fff&color=000'" alt="Barber" class="w-full h-full object-cover rounded-full">
            </div>
            <h1 class="text-3xl font-serif font-bold tracking-wide">HAZI STUDIO</h1>
            <p class="text-gray-400 text-sm mt-1 uppercase text-[10px]">Premium Cuts by Fahrul</p>
        </div>

        <div class="p-6 bg-dark min-h-[300px]">
            <div class="flex justify-between items-end mb-6">
                <h3 class="text-lg font-serif font-bold text-white">Pilih Jadwal</h3>
                <span class="text-[10px] text-gray-500 bg-white/5 px-2 py-1 rounded">Hari Ini</span>
            </div>
            
            <div id="slot-container" class="space-y-3">
                <div class="text-center text-gray-500 py-10 animate-pulse">Sedang memuat jadwal...</div>
            </div>
            
            <div id="error-msg" class="hidden mt-6 p-4 bg-red-900/20 border border-red-900/50 rounded-lg text-center"></div>
        </div>
    </div>

    <script>
        const WA_NUMBER = "6288271187357";
        const CONTAINER = document.getElementById('slot-container');
        const ERROR_DIV = document.getElementById('error-msg');

        // FUNGSI UTAMA: Ambil URL dari config.json, lalu ambil Slot
        async function init() {
            try {
                // 1. Baca Config dari Vercel sendiri
                // Tambah timestamp agar tidak kena cache browser (?t=...)
                const configRes = await fetch('config.json?t=' + new Date().getTime());
                if (!configRes.ok) throw new Error("Gagal baca config");
                
                const config = await configRes.json();
                const API_URL = config.api_url;

                if (!API_URL || API_URL.includes("ganti-dengan")) {
                    renderError("⚠️ SYSTEM MAINTENANCE", "Server sedang dalam pemeliharaan. Coba lagi nanti.");
                    return;
                }

                // 2. Baca Slot dari API STB
                const slotRes = await fetch(`${API_URL}/slots`);
                if (!slotRes.ok) throw new Error("Server STB Offline");
                
                const slotData = await slotRes.json();
                renderSlots(slotData.slots);

            } catch (err) {
                console.error(err);
                renderError("❌ KONEKSI GAGAL", "Gagal menghubungi server Hazi Studio.<br>Silakan hubungi admin/WA.");
            }
        }

        function renderSlots(slots) {
            CONTAINER.innerHTML = '';
            const hours = ["10:00", "11:00", "12:00", "13:00", "14:00"];
            const now = new Date();
            const currentHour = now.getHours();

            hours.forEach(time => {
                let status = slots[time] || 'booked';
                const slotHour = parseInt(time.split(':')[0]);
                
                // Logic Expired sederhana (cek jam saja biar aman)
                if (currentHour >= slotHour && now.getMinutes() > 0) {
                     if(currentHour > slotHour) status = 'expired'; 
                     // Jika jam sama tapi menit > 0, kita anggap expired visualnya (opsional)
                }

                const isAvailable = status === 'available';
                
                let btnHtml = isAvailable 
                    ? `<button onclick="openWA('${time}')" class="bg-white text-black font-bold text-xs px-4 py-2 rounded-lg hover:bg-gray-200 transition">BOOKING</button>`
                    : `<span class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">${status === 'expired' ? 'SELESAI' : 'BOOKED'}</span>`;

                const el = document.createElement('div');
                el.className = `w-full p-4 rounded-2xl flex justify-between items-center mb-3 ${isAvailable ? 'bg-white/5 border border-white/20' : 'bg-white/[0.02] opacity-50'}`;
                el.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="h-2 w-2 rounded-full ${isAvailable ? 'bg-green-500 shadow-[0_0_8px_#22c55e]' : 'bg-gray-600'}"></div>
                        <span class="font-serif font-bold text-xl text-white">${time}</span>
                    </div>
                    <div>${btnHtml}</div>
                `;
                CONTAINER.appendChild(el);
            });
        }

        function openWA(time) {
            window.location.href = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent("Halo, mau booking Hazi Studio jam " + time)}`;
        }

        function renderError(title, msg) {
            CONTAINER.innerHTML = '';
            ERROR_DIV.classList.remove('hidden');
            ERROR_DIV.innerHTML = `<p class="text-red-400 text-sm font-bold">${title}</p><p class="text-gray-500 text-[10px] mt-1">${msg}</p>`;
        }

        init();
    </script>
</body>
</html>
