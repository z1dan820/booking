<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Config - Hazi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-sm">
        <h2 class="text-xl font-bold mb-4 text-slate-900">🔗 Koneksi Server STB</h2>
        
        <label class="block text-sm font-medium text-gray-700 mb-1">Domain Cloudflare</label>
        <input type="text" id="apiUrl" placeholder="https://xxxx.trycloudflare.com" 
            class="w-full p-3 border border-gray-300 rounded mb-4 focus:outline-none focus:border-blue-500">

        <div class="flex gap-2">
            <button onclick="save()" class="flex-1 bg-slate-900 text-white p-3 rounded font-bold hover:bg-slate-800">SIMPAN</button>
            <button onclick="test()" class="w-1/3 bg-gray-200 text-gray-800 p-3 rounded font-bold hover:bg-gray-300">TEST</button>
        </div>

        <div id="status" class="mt-4 text-center text-sm font-mono"></div>
    </div>

    <script>
        const input = document.getElementById('apiUrl');
        const status = document.getElementById('status');
        
        // Load saved URL
        input.value = localStorage.getItem('hazi_api_url') || '';

        function save() {
            let url = input.value.trim();
            // Hapus trailing slash
            if(url.endsWith('/')) url = url.slice(0, -1);
            
            localStorage.setItem('hazi_api_url', url);
            status.innerHTML = `<span class="text-green-600">✅ URL Disimpan!</span>`;
            setTimeout(() => status.innerHTML = '', 2000);
        }

        async function test() {
            const url = input.value.trim();
            status.innerHTML = `<span class="text-blue-600">⏳ Testing...</span>`;
            try {
                const res = await fetch(`${url}/health`);
                const data = await res.json();
                if(data.status === 'ok') {
                    status.innerHTML = `<span class="text-green-600 font-bold">CONNECTED OK!</span>`;
                }
            } catch (e) {
                status.innerHTML = `<span class="text-red-600 font-bold">FAILED / OFFLINE</span>`;
            }
        }
    </script>
</body>
</html>
